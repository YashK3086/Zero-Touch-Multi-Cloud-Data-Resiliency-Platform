name: Enterprise Multi-Cloud DR CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Reason for manual drill trigger"
        required: false
        default: "Manual Operational Verification"

permissions:
  contents: read

jobs:
  code-and-policy-validation:
    name: DevSecOps & Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Run Test Suite
        run: |
          pytest -v --cov=sf_dr_controller --cov-report=term-missing

  terraform-lint-and-validate:
    name: Terraform Static Analysis & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        env:
          AWS_ACCESS_KEY_ID: "mock_ci_key"
          AWS_SECRET_ACCESS_KEY: "mock_ci_secret"
          AWS_REGION: "us-east-1"
          ARM_SUBSCRIPTION_ID: "00000000-0000-0000-0000-000000000000"
          ARM_TENANT_ID: "00000000-0000-0000-0000-000000000000"
          ARM_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
          ARM_CLIENT_SECRET: "mock_ci_secret"
          TF_VAR_snowflake_user: "mock_user"
          TF_VAR_snowflake_role: "ACCOUNTADMIN"
          TF_VAR_snowflake_primary_account: "ORG-PRIMARY"
          TF_VAR_snowflake_secondary_account: "ORG-SECONDARY"
        run: terraform validate

  container-and-k8s-validation:
    name: Docker Build & Kubernetes Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Controller Daemon Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.daemon
          push: false
          tags: sf-dr-daemon:test

      - name: Build Dashboard Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.dashboard
          push: false
          tags: sf-dr-dashboard:test

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/

  notify-pipeline-status:
    name: Dispatch Pipeline Status to Slack
    needs: [code-and-policy-validation, terraform-lint-and-validate, container-and-k8s-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack of Pipeline Execution Result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AUTHOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PIPELINE_RESULT: ${{ (needs.code-and-policy-validation.result == 'success' && needs.terraform-lint-and-validate.result == 'success' && needs.container-and-k8s-validation.result == 'success') && 'PASSED' || 'FAILED' }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            COLOR="#2ecc71"
            STATUS_MSG="All 3 CI Gates Passed (Unit Tests, Terraform IaC, Docker/K8s)"
            if [ "$PIPELINE_RESULT" != "PASSED" ]; then
              COLOR="#e74c3c"
              STATUS_MSG="One or more CI stages failed. Inspect GitHub Actions log."
            fi
            curl -X POST -H 'Content-type: application/json' --data "{
              \"text\": \"🛡️ *Multi-Cloud DR Pipeline - Build ${PIPELINE_RESULT}*\n*Pushed By:* \`${AUTHOR}\`\n*Branch:* \`${REF_NAME}\`\n*Commit:* \`${COMMIT_SHA:0:7}\` - ${COMMIT_MSG}\",
              \"attachments\": [{
                \"color\": \"${COLOR}\",
                \"fields\": [
                  {\"title\": \"Status\", \"value\": \"${STATUS_MSG}\", \"short\": true},
                  {\"title\": \"Actor\", \"value\": \"${AUTHOR}\", \"short\": true}
                ]
              }]
            }" "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL secret not configured, skipping Slack push event."
          fi