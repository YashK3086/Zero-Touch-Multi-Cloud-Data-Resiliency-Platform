name: SaaS Control Plane CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-saas-platform:
    name: Backend Engine & React UI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install & Test Python DR Engine
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest fastapi uvicorn starlette boto3 requests
          pip install -e .
          ruff check src tests
          pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Dashboard UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
