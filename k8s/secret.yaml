apiVersion: v1
kind: Secret
metadata:
  name: sf-dr-secret
  labels:
    app.kubernetes.io/name: sf-dr-controller
type: Opaque
stringData:
  DR_WEBHOOK_URL: "${DR_WEBHOOK_URL}"
  SNOWFLAKE_PRIVATE_KEY_PATH: "/etc/snowflake/rsa_key.p8"
  SNOWFLAKE_PASSWORD: "${SNOWFLAKE_PASSWORD}"
  SNOWFLAKE_SECONDARY_PASSWORD: "${SNOWFLAKE_SECONDARY_PASSWORD}"
  