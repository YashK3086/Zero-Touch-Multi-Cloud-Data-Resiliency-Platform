apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-dr-ingest
  labels:
    app.kubernetes.io/name: sf-dr-ingest
    app.kubernetes.io/component: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sf-dr-ingest
  template:
    metadata:
      labels:
        app: sf-dr-ingest
    spec:
      containers:
        - name: ingest
          image: sf-dr-ingest:latest
          imagePullPolicy: IfNotPresent
          args: ["--rate", "50", "--interval", "2"]
          env:
            - name: AWS_S3_BUCKET
              value: "sf-dr-primary-stage-drdemo"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
