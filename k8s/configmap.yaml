apiVersion: v1
kind: ConfigMap
metadata:
  name: sf-dr-config
  labels:
    app.kubernetes.io/name: sf-dr-controller
    app.kubernetes.io/part-of: cross-cloud-resiliency
data:
  SNOWFLAKE_ACCOUNT_PRIMARY: "NNFCDXY-SF_AWS_PRIMARY"
  SNOWFLAKE_ACCOUNT_SECONDARY: "NNFCDXY-SF_AZURE_DR"
  SNOWFLAKE_USER: "YASHSNOW20"
  SNOWFLAKE_ROLE: "ACCOUNTADMIN"
  SNOWFLAKE_WAREHOUSE: "DR_CONTROLLER_WH"
  SNOWFLAKE_DATABASE: "SF_DR_DEMO_DB"
  SNOWFLAKE_FAILOVER_GROUP_NAME: "SF_DR_FAILOVER_GROUP"
  SNOWFLAKE_REDIRECT_CONNECTION_NAME: "SF_DR_GLOBAL_REDIRECT"
  DR_PROBE_INTERVAL_SECONDS: "10"
  DR_PROBE_TIMEOUT_SECONDS: "10"
  DR_FAILURE_THRESHOLD: "3"
  DR_AUTO_FAILOVER: "true"
  DR_DRY_RUN: "false"
