apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-dr-daemon
  labels:
    app.kubernetes.io/name: sf-dr-daemon
    app.kubernetes.io/component: sentry-controller
spec:
  replicas: 1  # Single active watchdog sentry to prevent split-brain failover race conditions
  selector:
    matchLabels:
      app: sf-dr-daemon
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sf-dr-daemon
    spec:
      containers:
        - name: daemon
          image: sf-dr-daemon:latest
          imagePullPolicy: IfNotPresent
          args: ["--plain-logs", "daemon", "--interval", "10", "--strikes", "3"]
          envFrom:
            - configMapRef:
                name: sf-dr-config
            - secretRef:
                name: sf-dr-secret
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sf_dr_controller; print('healthy')"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from sf_dr_controller.config import Settings; s = Settings(); assert s.snowflake_account_primary"
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: rsa-key-volume
              mountPath: /etc/snowflake
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: rsa-key-volume
          secret:
            secretName: sf-dr-rsa-key
            defaultMode: 0400
