apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-dr-dashboard
  labels:
    app.kubernetes.io/name: sf-dr-dashboard
    app.kubernetes.io/component: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sf-dr-dashboard
  template:
    metadata:
      labels:
        app: sf-dr-dashboard
    spec:
      containers:
        - name: dashboard
          image: sf-dr-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sf-dr-config
            - secretRef:
                name: sf-dr-secret
          startupProbe:
            httpGet:
              path: /api/status
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: rsa-key-volume
              mountPath: /etc/snowflake
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: rsa-key-volume
          secret:
            secretName: sf-dr-rsa-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: sf-dr-dashboard-service
  labels:
    app.kubernetes.io/name: sf-dr-dashboard
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: sf-dr-dashboard
