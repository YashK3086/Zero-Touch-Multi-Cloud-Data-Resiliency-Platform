services:
  sf-dr-daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    container_name: sf-dr-daemon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./rsa_key.p8:/app/rsa_key.p8:ro
      - ./rsa_key.p8:/app/keys/rsa_key.p8:ro
    command: ["daemon", "--interval", "10", "--strikes", "3"]

  sf-dr-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: sf-dr-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./rsa_key.p8:/app/rsa_key.p8:ro
      - ./rsa_key.p8:/app/keys/rsa_key.p8:ro
