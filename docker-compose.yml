services:
  sf-dr-daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    container_name: sf-dr-daemon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./rsa_key.p8:/app/keys/rsa_key.p8:ro
    command: ["daemon", "--interval", "10", "--strikes", "3"]

  sf-dr-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: sf-dr-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./rsa_key.p8:/app/keys/rsa_key.p8:ro
